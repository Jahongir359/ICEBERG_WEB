{% extends "admin_base.html" %}

{% block title %}Boshqaruv paneli - ICEBERG Admin{% endblock %}

{% block page_title %}Boshqaruv paneli{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <a href="{{ url_for('students') }}" class="bg-white shadow-lg rounded-xl p-6 flex items-center hover:shadow-xl transition-shadow duration-300">
        <div class="bg-blue-500 rounded-full p-4 mr-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197M15 21a6 6 0 006-6v-1a3 3 0 00-3-3H9a3 3 0 00-3 3v1a6 6 0 006 6z"></path></svg>
        </div>
        <div>
            <h3 class="text-lg font-semibold text-gray-700">Jami Ro'yxatdan o'tganlar</h3>
            <p class="text-3xl font-bold text-[#0D2444] mt-1">{{ stats.total_students }}</p>
        </div>
    </a>
    <a href="{{ url_for('contacts_list') }}" class="bg-white shadow-lg rounded-xl p-6 flex items-center hover:shadow-xl transition-shadow duration-300">
        <div class="bg-green-500 rounded-full p-4 mr-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <div>
            <h3 class="text-lg font-semibold text-gray-700">Jami Aloqa Xabarlari</h3>
            <p class="text-3xl font-bold text-[#0D2444] mt-1">{{ stats.total_contacts }}</p>
        </div>
    </a>
</div>
{% endblock %}
