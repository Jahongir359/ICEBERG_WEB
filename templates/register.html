<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICEBERG - Registration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-input-underline {
            border: none;
            border-bottom: 1px solid #e2e8f0; /* gray-300 */
            padding-left: 2px;
            padding-right: 2px;
            border-radius: 0;
        }
        .form-input-underline:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: #4a5568; /* gray-700 */
            --tw-ring-shadow: 0 0 #0000; /* Remove focus ring */
        }
    </style>
</head>
<body class="text-gray-800 bg-gray-50">

    <!-- Main Container: wraps entire page content -->
    <div class="mx-auto max-w-full">

        <!-- Header: logo and navigation -->
        <nav class="bg-[#4a3aff] shadow-lg">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between">
                    <div class="flex space-x-7">
                        <div>
                            <!-- Website Logo -->
                            <a href="{{ url_for('index') }}" class="flex items-center py-4 px-2">
                                <span class="font-semibold text-white text-lg">ICEBERG</span>
                            </a>
                        </div>
                        <!-- Primary Navbar items -->
                        <div class="hidden md:flex items-center space-x-1">
                            <a href="{{ url_for('index') }}" class="py-4 px-2 text-white font-semibold hover:text-gray-300 transition duration-300">Home</a>
                            <a href="{{ url_for('about') }}" class="py-4 px-2 text-white font-semibold hover:text-gray-300 transition duration-300">About Us</a>
                            <a href="{{ url_for('questions') }}" class="py-4 px-2 text-white font-semibold hover:text-gray-300 transition duration-300">FAQ</a>
                            <a href="{{ url_for('contact') }}" class="py-4 px-2 text-white font-semibold hover:text-gray-300 transition duration-300">Contact</a>
                        </div>
                    </div>
                    <!-- Secondary Navbar items -->
                    <div class="hidden md:flex items-center space-x-3 ">
                        <a href="{{ url_for('register') }}" class="py-2 px-2 font-medium text-white bg-green-500 rounded hover:bg-green-400 transition duration-300">Register</a>
                    </div>
                    <!-- Mobile menu button -->
                    <div class="md:hidden flex items-center">
                        <button class="outline-none mobile-menu-button">
                        <svg class=" w-6 h-6 text-gray-500 hover:text-green-500 "
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                    </div>
                </div>
            </div>
            <!-- mobile menu -->
            <div class="hidden mobile-menu">
                <ul class="">
                    <li><a href="{{ url_for('index') }}" class="block text-sm px-2 py-4 hover:bg-green-500 transition duration-300">Home</a></li>
                    <li><a href="{{ url_for('about') }}" class="block text-sm px-2 py-4 hover:bg-green-500 transition duration-300">About Us</a></li>
                    <li><a href="{{ url_for('questions') }}" class="block text-sm px-2 py-4 hover:bg-green-500 transition duration-300">FAQ</a></li>
                    <li><a href="{{ url_for('contact') }}" class="block text-sm px-2 py-4 hover:bg-green-500 transition duration-300">Contact</a></li>
                    <li class="active"><a href="{{ url_for('register') }}" class="block text-sm px-2 py-4 text-white bg-green-500 font-semibold">Register</a></li>
                </ul>
            </div>
            <script>
                const btn = document.querySelector("button.mobile-menu-button");
                const menu = document.querySelector(".mobile-menu");
        
                btn.addEventListener("click", () => {
                    menu.classList.toggle("hidden");
                });
            </script>
        </nav>

        <!-- Main Content: registration section -->
        <main>
             <section class="py-12 md:py-20 px-4 sm:px-6 lg:px-8">
                 <!-- Section Title: heading and subtitle -->
                 <div class="text-center">
                     <h1 class="text-5xl md:text-6xl font-bold tracking-wider text-gray-800">REGISTER</h1>
                     <p class="text-xl text-gray-500 mt-4 tracking-widest">HAPPINESS IS IN SCIENCE !!!</p>
                 </div>
                 <!-- Form Container: white card wrapper -->
                 <div class="max-w-lg mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
                    <form action="/register" method="POST">
                        <!-- Full Name -->
                        <div class="mb-6">
                            <label for="name" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                            <input type="text" id="name" name="name" class="w-full px-4 py-2 form-input-underline focus:border-blue-500" placeholder="Azizbek" required>
                        </div>

                        <!-- Email Address -->
                        <div class="mb-6">
                            <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                            <input type="email" id="email" name="email" class="w-full px-4 py-2 form-input-underline focus:border-blue-500" placeholder="example@gmail.com" required>
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-6">
                            <label for="phone" class="block text-gray-700 font-semibold mb-2">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="w-full px-4 py-2 form-input-underline focus:border-blue-500" placeholder="+998939461699">
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-300 text-lg shadow-md">Register Now</button>
                    </form>
                 </div>
             </section>
        </main>

    </div>
</body>
</html>
