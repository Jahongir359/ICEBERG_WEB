name: iceberg-web
region: nyc
services:
  - name: web
    github:
      repo: jahongir359/iceberg_web
      branch: main
      # SQLite and uploads need durable storage before enabling automatic deploys.
      deploy_on_push: false
    run_command: gunicorn app:app --bind 0.0.0.0:8080 --workers 1 --timeout 120
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FLASK_ENV
        value: production
        scope: RUN_TIME
      - key: REGISTRATION_LEADS_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: REGISTRATION_LEADS_API_TIMEOUT
        value: "8"
        scope: RUN_TIME
